<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Field Advantage – demo</title>
<meta name="description" content="Home Field Advantage: a fundraising pass that saves you money at local businesses all season while backing your team.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#FAF7F2; --surface:#FFFFFF; --ink:#24100F; --muted:#6E5D59; --line:#EBE1D6;
  --royal:#7A1E2C; --royal-ink:#FFFFFF; --gold:#C9A227; --gold-ink:#FFFFFF;
  --chip:#F3E9DC; --warn:#9A5B00;
  --display:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#140809; --surface:#22100F; --ink:#FBF1E6; --muted:#BFA9A2; --line:#3A1F1D;
    --royal:#E0B53E; --royal-ink:#2A0E0C; --gold:#E0B53E; --chip:#2E1716; --warn:#FFC86B;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#140809; --surface:#22100F; --ink:#FBF1E6; --muted:#BFA9A2; --line:#3A1F1D;
  --royal:#E0B53E; --royal-ink:#2A0E0C; --gold:#E0B53E; --chip:#2E1716; --warn:#FFC86B;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;padding:0 20px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}

.top{display:flex;align-items:center;gap:10px;padding:18px 0 4px;font-weight:700;font-size:15px}
.top svg{flex:none}
h1{font-family:var(--display);font-weight:800;font-size:clamp(40px,11vw,58px);line-height:1;margin:22px 0 14px;letter-spacing:-.04em}
h2{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.1;margin:28px 0 12px;letter-spacing:-.03em}
h3{font-size:17px;margin:28px 0 10px}
p{margin:0 0 14px}
.lede{color:var(--muted);max-width:40ch}
.small{font-size:14px;color:var(--muted)}

/* The pass: the one bold element */
.pass{position:relative;color:#fff;border-radius:26px;padding:20px 24px 22px;overflow:hidden;margin:22px 0;
  background:radial-gradient(circle at 88% 12%,rgba(224,181,62,.45),transparent 42%),linear-gradient(135deg,#391213 0%,#7A1E2C 55%,#A8323F 100%);
  box-shadow:0 24px 48px -22px rgba(122,30,44,.6)}
.pass::after{content:"";position:absolute;right:-70px;bottom:-90px;width:230px;height:230px;border-radius:50%;
  border:30px solid rgba(255,255,255,.09)}
.pass-top{display:flex;justify-content:space-between;font-weight:700;font-size:14px;padding-right:76px}
.pass-num{font-family:var(--display);font-weight:800;font-size:clamp(84px,26vw,120px);line-height:.9;letter-spacing:-.05em;margin:16px 0 12px;position:relative;z-index:1}
.pass-num .no{font-size:.26em;vertical-align:top;margin-right:4px;display:inline-block;padding-top:.3em}
.pass-who{display:flex;flex-direction:column;padding-right:76px}
.pass-who strong{font-size:19px}
.pass-who span{font-size:14px}
.pass.sample .pass-num{opacity:.35}
.pass-by{position:relative;z-index:1;display:flex;align-items:center;gap:10px;margin-top:16px;padding-top:12px;border-top:1px solid rgba(255,255,255,.28);font-size:13px}
.pass-by span{border:1.5px dashed rgba(255,255,255,.65);border-radius:8px;padding:4px 10px;font-weight:700}
.partners{margin:36px 0 8px;text-align:center}
.partners .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:0 0 10px}
.slot{border:1.5px dashed var(--line);border-radius:16px;display:grid;place-items:center;color:var(--muted);font-weight:700;font-size:14px;background:var(--surface)}
.slot.big{height:76px;margin-bottom:18px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.slots .slot{height:54px;font-size:12px;padding:0 6px;text-align:center}

.price{display:flex;align-items:baseline;gap:10px;margin:4px 0 16px}
.price b{font-family:var(--display);font-weight:800;font-size:52px;line-height:1;letter-spacing:-.04em}
label.f{display:block;font-weight:700;font-size:15px;margin:0 0 6px}
.field{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:14px}
.field:focus{border-color:var(--royal);outline:none}
.btn{display:block;width:100%;background:var(--royal);color:var(--royal-ink);border:0;border-radius:999px;padding:16px;font-weight:700;font-size:17px;box-shadow:0 10px 24px -12px rgba(122,30,44,.7);cursor:pointer;text-align:center;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;color:var(--royal);font-weight:700;padding:6px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

ol.steps{list-style:none;counter-reset:s;padding:0;margin:0}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:40px 1fr;gap:12px;padding:10px 0;align-items:start}
ol.steps li::before{content:counter(s);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;background:var(--chip);color:var(--royal)}
.bizwrap{display:flex;flex-wrap:wrap;gap:8px}
.bizwrap span{background:var(--chip);padding:6px 12px;border-radius:999px;font-size:14px}

/* Offers */
.search{margin:4px 0 12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 12px;margin:0 -2px}
.chip{flex:none;border:0;background:var(--chip);border-radius:999px;padding:8px 16px;font-weight:700;font-size:15px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--royal);color:var(--royal-ink)}
.banner{background:var(--surface);border:1.5px dashed var(--royal);border-radius:14px;padding:14px 16px;margin:6px 0 16px;display:flex;gap:12px;align-items:center;justify-content:space-between}
.banner .btn{width:auto;padding:10px 16px;font-size:15px;flex:none}
.list{background:var(--surface);border-radius:22px;border:1px solid var(--line);overflow:hidden}
.row{display:grid;grid-template-columns:46px 1fr auto;gap:14px;align-items:center;padding:14px 16px;width:100%;background:none;border:0;border-top:1px solid var(--line);text-align:left;cursor:pointer}
.row:first-child{border-top:0}
.row:hover{background:color-mix(in srgb,var(--chip) 50%,transparent)}
.logo{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:16px}
.row .biz{font-size:14px;color:var(--muted)}
.row .deal{font-weight:700;line-height:1.3}
.tag{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--chip);white-space:nowrap}
.tag.used{background:transparent;color:var(--muted);border:1px solid var(--line)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}

/* Pass page */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:36px;line-height:1.05;letter-spacing:-.04em;color:var(--royal)}
.hist .row{cursor:default;grid-template-columns:46px 1fr}
.hist .row:hover{background:none}

/* Tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 0 12px;color:var(--muted);text-decoration:none;font-weight:700;font-size:13px}
.tabs a[aria-current="page"]{color:var(--royal)}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(8,10,20,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto;animation:up .22s ease-out}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet .logo{width:58px;height:58px;font-size:20px}
.sheet .bigdeal{font-family:var(--display);font-weight:800;font-size:32px;line-height:1.1;letter-spacing:-.03em;margin:14px 0 10px}
.meta{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:15px;margin:14px 0 20px}
.meta dt{color:var(--muted)}
.meta dd{margin:0}
.notice{color:var(--warn);font-weight:700;font-size:15px;margin:-6px 0 14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.test{font-size:13px;background:var(--chip);border-radius:8px;padding:8px 12px;margin:0 0 14px}
.ok{width:72px;height:72px;border-radius:50%;background:#7A1E2C;display:grid;place-items:center;margin:8px auto 14px}

/* Redemption screen */
.redeem{position:fixed;inset:0;z-index:60;background:linear-gradient(160deg,#391213 0%,#7A1E2C 60%,#A8323F 100%);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));overflow:hidden}
.redeem::before{content:"";position:absolute;inset:-60%;background:repeating-linear-gradient(45deg,rgba(255,255,255,.09) 0 24px,transparent 24px 48px);animation:slide 1.6s linear infinite}
@keyframes slide{to{transform:translateX(67.88px)}}
.redeem > *{position:relative}
.redeem .check{width:96px;height:96px;border-radius:50%;background:#fff;display:grid;place-items:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.3)}}
.redeem .r-biz{font-size:18px;font-weight:700;margin:20px 0 2px;opacity:.9}
.redeem .r-deal{font-family:var(--display);font-weight:800;font-size:clamp(32px,9vw,46px);line-height:1.05;letter-spacing:-.03em;max-width:14ch;margin:0 auto 18px}
.redeem .clock{font-family:var(--display);font-weight:800;font-size:clamp(56px,17vw,88px);line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.redeem .r-date{font-size:17px;margin:6px 0 18px}
.redeem .r-pass{background:rgba(0,0,0,.22);border-radius:12px;padding:10px 16px;font-size:15px;margin-bottom:24px}
.redeem .btn{background:#fff;color:#7A1E2C;max-width:320px}
.redeem .hint{font-size:13px;opacity:.85;margin-top:14px;max-width:30ch}

/* Welcome tour */
.scrim.center{align-items:center;padding:20px}
.welcome{background:var(--bg);width:100%;max-width:420px;border-radius:28px;padding:30px 24px 22px;text-align:center;animation:up .25s ease-out}
.w-icon{width:84px;height:84px;border-radius:26px;margin:0 auto 18px;display:grid;place-items:center;color:#fff;
  background:radial-gradient(circle at 80% 15%,rgba(224,181,62,.6),transparent 50%),linear-gradient(135deg,#391213,#7A1E2C 60%,#A8323F);box-shadow:0 16px 30px -16px rgba(122,30,44,.7)}
.w-step{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--royal);font-weight:800;margin:0 0 6px}
.welcome h2{margin:0 0 10px}
.welcome .w-body{color:var(--muted);min-height:100px;margin:0 0 8px}
.dots{display:flex;justify-content:center;gap:8px;margin:0 0 20px}
.dots i{width:8px;height:8px;border-radius:99px;background:var(--line);transition:width .2s}
.dots i.on{width:24px;background:var(--royal)}
.w-actions{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}

/* Demo role switcher */
.rolebar{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.rolebar .wrap{display:flex;align-items:center;gap:10px;padding-top:8px;padding-bottom:8px}
.rolebar .lbl{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);flex:none}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;background:var(--chip);border-radius:999px;padding:4px;flex:1}
.seg a{text-align:center;text-decoration:none;color:var(--ink);font-weight:700;font-size:13px;padding:7px 2px;border-radius:999px}
.seg a[aria-current="page"]{background:var(--royal);color:var(--royal-ink)}

/* Coach + business dashboards */
.kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--royal);font-weight:800;margin:22px 0 4px}
.goal{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px 18px;margin:12px 0}
.goal .bar{height:12px;border-radius:99px;background:var(--chip);overflow:hidden;margin:10px 0 6px}
.goal .bar i{display:block;height:100%;background:linear-gradient(90deg,#7A1E2C,#C9A227);border-radius:99px}
.board .row{cursor:default;grid-template-columns:30px 1fr auto;gap:12px}
.board .row:hover{background:none}
.rank{font-family:var(--display);font-weight:800;font-size:20px;color:var(--muted);text-align:center}
.board .mini{height:6px;border-radius:99px;background:var(--chip);margin-top:6px;overflow:hidden}
.board .mini i{display:block;height:100%;background:var(--royal);border-radius:99px}
.board .cnt{text-align:right}
.board .cnt b{display:block;font-size:20px;font-family:var(--display);font-weight:800}
.copy{font-size:13px;font-weight:700;color:var(--royal);background:var(--chip);border:0;border-radius:999px;padding:6px 12px;cursor:pointer;margin-top:8px}
.biz-head{display:flex;align-items:center;gap:14px;margin:18px 0 6px}
.biz-head .logo{width:58px;height:58px;font-size:20px;flex:none}
.youbadge{display:inline-block;font-size:12px;font-weight:800;background:var(--royal);color:var(--royal-ink);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:middle}
.supporting{background:var(--chip);border-radius:14px;padding:10px 14px;font-weight:700;font-size:15px;margin:0 0 14px}

@media (prefers-reduced-motion: reduce){
  .welcome{animation:none}
  .redeem::before,.redeem .check,.sheet{animation:none}
}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" aria-label="Main"><div class="in">
  <a href="#offers" id="tab-offers"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 9V5a2 2 0 0 1 2-2h4l12 12-6 6L3 9z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>Offers</a>
  <a href="#pass" id="tab-pass"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M15 5v14"/></svg>My pass</a>
</div></nav>
<div id="layer"></div>

<script>
const ORG = "DCS Tigers Football";
const PRICE = 25;
const TEAMS = ["Tigers Football team fund","Sample Player #7","Sample Player #12","Sample Player #22","Sample Player #54"];
const BASE_OFFERS = [
  {id:"marios",biz:"Mario’s Brick Oven",deal:"$5 off any large pizza",cat:"Food",limit:"monthly",value:5,color:"#C2410C",fine:"Dine-in or pickup. Can’t be combined with other offers.",addr:"214 Main St"},
  {id:"sunrise",biz:"Sunrise Coffee Co.",deal:"Free pastry with any drink",cat:"Food",limit:"monthly",value:4,color:"#7C4A2D",fine:"One pastry per visit. Any size drink.",addr:"9 Depot Square"},
  {id:"elsol",biz:"Taqueria El Sol",deal:"Free chips & queso with any entrée",cat:"Food",limit:"unlimited",value:6,color:"#B91C1C",fine:"Dine-in only.",addr:"77 River Rd"},
  {id:"scoops",biz:"Scoops Creamery",deal:"Buy one cone, get one free",cat:"Food",limit:"monthly",value:4,color:"#BE185D",fine:"Equal or lesser value. Seasonal hours.",addr:"5 Lake Ave"},
  {id:"bowl",biz:"Lakeside Lanes",deal:"Free shoe rental for up to 4",cat:"Fun",limit:"monthly",value:16,color:"#6D28D9",fine:"Valid with paid game. Not on league nights.",addr:"1200 Shoreline Dr"},
  {id:"cinema",biz:"Main Street Cinema",deal:"$3 off any movie ticket",cat:"Fun",limit:"unlimited",value:3,color:"#1E40AF",fine:"One ticket per visit.",addr:"140 Main St"},
  {id:"shack",biz:"The Sport Shack",deal:"20% off cleats, gloves & bats",cat:"Shopping",limit:"once",value:15,color:"#047857",fine:"Full-price items only.",addr:"3 Commerce Pkwy"},
  {id:"hardware",biz:"Pinecrest Hardware",deal:"15% off one item",cat:"Shopping",limit:"once",value:8,color:"#B45309",fine:"Excludes power tools and gift cards.",addr:"60 Pinecrest Blvd"},
  {id:"bloom",biz:"Bloom Florist",deal:"10% off any arrangement",cat:"Shopping",limit:"once",value:6,color:"#9D174D",fine:"In-store orders only.",addr:"22 Elm St"},
  {id:"wash",biz:"Glow Car Wash",deal:"$10 off the Ultimate wash",cat:"Services",limit:"once",value:10,color:"#0E7490",fine:"Can’t be combined with memberships.",addr:"880 Route 9"},
  {id:"cuts",biz:"Fresh Cuts Barbershop",deal:"$5 off any haircut",cat:"Services",limit:"monthly",value:5,color:"#334155",fine:"Walk-ins and appointments.",addr:"31 Oak St"}
];
const LIMIT = {once:"One time",monthly:"Once a month",unlimited:"Every visit"};
const GENEROSITY = {once:0,monthly:1,unlimited:2};
const NEW_COLORS = ["#0F766E","#A16207","#7E22CE","#BE123C","#15803D","#1D4ED8"];
const SEED_PENDING = [
  {pid:"p1",type:"change",offerId:"bowl",ts:Date.now()-5*3600e3,proposed:{deal:"Free shoe rental for up to 2",limit:"monthly"}},
  {pid:"p2",type:"new",ts:Date.now()-26*3600e3,proposed:{biz:"Prairie Rose Bakery",cat:"Food",addr:"712 Chief St",contact:"owner@prairierose.example",deal:"Free cookie with any coffee",limit:"monthly",fine:"One cookie per visit."}}
];
let OFFERS = [];
function rebuildOffers(){
  const added = (state.added||[]);
  const today = new Date().toISOString().slice(0,10);
  OFFERS = [...BASE_OFFERS, ...added].map(o=>{ const x = Object.assign({}, o, (state.edits||{})[o.id]||{}); if(x.paused && x.paused<=today) x.paused = null; return x; });
  if(!OFFERS.find(o=>o.id===ui.biz)) ui.biz = OFFERS[0].id;
}
function clean(v){ return String(v||"").replace(/[<>]/g,"").trim(); }
const CATS = ["All","Food","Fun","Shopping","Services"];
const KEY = "hometown-pass-demo";

/* Demo numbers for the coach and business views */
const GOAL = 150;
const SALES = {"Tigers Football team fund":14,"Sample Player #7":23,"Sample Player #12":17,"Sample Player #22":31,"Sample Player #54":9};
const BIZSTATS = {marios:[19,71],sunrise:[24,88],elsol:[31,102],scoops:[12,40],bowl:[8,27],cinema:[15,49],shack:[6,21],hardware:[9,30],bloom:[4,13],wash:[7,26],cuts:[11,38]};

let state = load();
let ui = {view:"pass", cat:"All", q:"", team:TEAMS[0], biz:BASE_OFFERS[0].id, fromLink:false};
(function(){
  const p = new URLSearchParams(location.search).get("player");
  if(!p) return;
  const t = TEAMS.find(x=>x.endsWith("#"+p));
  if(t){ ui.team = t; ui.fromLink = true; }
})();
let clockTimer = null;
rebuildOffers();

function load(){
  load.blank = ()=>({purchased:false,name:"",email:"",team:"",passNo:"",redemptions:[],member:null,changesUsed:0,edits:{},added:[],pending:JSON.parse(JSON.stringify(SEED_PENDING))});
  const blank = {purchased:false,name:"",email:"",team:"",passNo:"",redemptions:[],member:null,changesUsed:0,edits:{},added:[],pending:JSON.parse(JSON.stringify(SEED_PENDING))};
  try{ const s = JSON.parse(localStorage.getItem(KEY)); return s ? Object.assign(blank,s) : blank; }catch(e){ return blank; }
}
function save(){ rebuildOffers(); try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function initials(b){ return b.replace(/^The /,"").split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase(); }
function fmtDay(d){ return d.toLocaleDateString("en-US",{month:"short",day:"numeric"}); }
function logo(o){ return `<span class="logo" style="background:${o.color}" aria-hidden="true">${initials(o.biz)}</span>`; }

function status(o){
  if(o.paused) return {ok:false, paused:true, msg:`Paused by ${o.biz} until ${fmtDay(new Date(o.paused+"T12:00"))}.`, short:"Paused"};
  if(!state.purchased) return {ok:false, locked:true};
  const mine = state.redemptions.filter(r=>r.offerId===o.id);
  if(o.limit==="once" && mine.length){
    return {ok:false, msg:`Used ${fmtDay(new Date(mine[mine.length-1].ts))}`};
  }
  if(o.limit==="monthly"){
    const now = new Date();
    const hit = mine.find(r=>{const d=new Date(r.ts); return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();});
    if(hit){
      const next = new Date(now.getFullYear(), now.getMonth()+1, 1);
      return {ok:false, msg:`Used ${fmtDay(new Date(hit.ts))}. Available again ${fmtDay(next)}.`, short:`Back ${fmtDay(next)}`};
    }
  }
  return {ok:true};
}

  const rules = `<p class="small" style="margin:10px 0 0">One household member per pass. Deal limits are shared, and you can change this person once per season.</p>`;
  if(!m){
    return `<h3>Household</h3><div class="goal">
      <strong>Add your spouse or partner</strong>
      <p class="small" style="margin:6px 0 12px">They get the pass on their own phone, so they can redeem deals without you there.</p>
      <button class="btn" data-action="hh-add">Add household member</button>
      ${rules}</div>`;
  }
  if(m.status==="invited"){
    return `<h3>Household</h3><div class="goal">
      <strong>Invite sent to ${esc(m.name)}</strong>
      <p class="small" style="margin:6px 0 12px">We texted a link to ${esc(m.contact)}. It works once, on one phone, and expires in 48 hours.</p>
      <button class="btn ghost" data-action="hh-accept">Demo: accept as ${esc(m.name.split(" ")[0])}</button>
      <button class="linkbtn" data-action="hh-remove" style="display:block;margin:10px auto 0">Cancel invite</button>
      ${rules}</div>`;
  }
  const canChange = state.changesUsed < MAX_CHANGES;
  return `<h3>Household</h3><div class="list"><div class="row" style="cursor:default;grid-template-columns:46px 1fr auto">
      <span class="logo" style="background:var(--royal)" aria-hidden="true">${initials(m.name)}</span>
      <div><div class="deal">${esc(m.name)}</div><div class="small">Active on their phone since ${fmtDay(new Date(m.ts))}</div></div>
      <span class="tag">Household</span></div></div>
    ${canChange ? `<button class="linkbtn" data-action="hh-remove">Remove ${esc(m.name.split(" ")[0])}</button>` : `<p class="small" style="margin-top:10px">You’ve used your one change for this season.</p>`}
    ${rules}`;
}
function sheetHousehold(){
  openSheet(`<h2 style="margin-top:0">Add a household member</h2>
    <p class="small">Add one spouse or partner who lives with you. They’ll get their own sign-in, and your deal limits are shared.</p>
    <label class="f" for="hn">Their full name</label><input class="field" id="hn" autocomplete="off" value="Sam Ellis">
    <label class="f" for="hc">Their mobile number</label><input class="field" id="hc" type="tel" inputmode="tel" value="(308) 555-0142">
    <label style="display:flex;gap:10px;align-items:flex-start;margin:0 0 16px;font-size:15px"><input type="checkbox" id="hok" style="margin-top:4px;width:20px;height:20px">
      <span>This person is my spouse or partner and lives at my address. I understand I can change this once per season.</span></label>
    <button class="btn" data-action="hh-send">Send invite</button>
    <button class="linkbtn" data-action="close" style="display:block;margin:12px auto 0">Cancel</button>`);
}

/* ---------- Sheets ---------- */
function openSheet(html){
  document.getElementById("layer").innerHTML = `<div class="scrim" data-action="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  const f = document.querySelector(".sheet button, .sheet input");
  if(f) f.focus();
}
function closeSheet(){ document.getElementById("layer").innerHTML = ""; }

function sheetCheckout(){
  openSheet(`<h2 style="margin-top:0">Checkout</h2>
    <p class="small">Advantage Pass 2026–27, crediting ${esc(ui.team)}.</p>
    <label class="f" for="nm">Full name</label><input class="field" id="nm" autocomplete="name" value="Jordan Ellis">
    <label class="f" for="em">Email</label><input class="field" id="em" type="email" autocomplete="email" value="jordan@example.com">
    <label class="f" for="cc">Card</label><input class="field" id="cc" value="4242 4242 4242 4242   12/28   123" inputmode="numeric">
    <p class="test">Test mode. In the real app this is Stripe Checkout, and no card is charged here.</p>
    <button class="btn" data-action="pay" id="paybtn">Pay $${PRICE}.00</button>
    <button class="linkbtn" data-action="close" style="display:block;margin:12px auto 0">Cancel</button>`);
}

function sheetSuccess(){
  openSheet(`<div style="text-align:center">
    <div class="ok"><svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div>
    <h2 style="margin-top:0">Pass No. ${state.passNo} is yours</h2>
    <p>$${PRICE} goes to ${esc(state.team)}. We emailed your receipt and sign-in link to ${esc(state.email)}.</p>
    <a class="btn" href="#offers" data-action="close">Browse offers</a></div>`);
}

function sheetOffer(id){
  const o = OFFERS.find(x=>x.id===id); const s = status(o);
  let cta;
  if(s.paused) cta = `<p class="notice">${s.msg}</p><button class="btn" disabled>Redeem in store</button>`;
  else if(s.locked) cta = `<a class="btn" href="#pass" data-action="close">Get a pass to redeem</a>`;
  else if(!s.ok) cta = `<p class="notice">${s.msg}</p><button class="btn" disabled>Redeem in store</button>`;
  else cta = `<button class="btn" data-action="redeem-start" data-id="${o.id}">Redeem in store</button>`;
  openSheet(`${logo(o)}
    <div class="bigdeal">${o.deal}</div>
    <div style="font-weight:700">${o.biz}</div>
    <dl class="meta"><dt>Use</dt><dd>${LIMIT[o.limit]}</dd><dt>Where</dt><dd>${o.addr}</dd><dt>Details</dt><dd>${o.fine}</dd><dt>Expires</dt><dd>Aug 31, 2027</dd></dl>
    ${cta}
    <button class="linkbtn" data-action="close" style="display:block;margin:12px auto 0">Close</button>`);
}

function sheetConfirm(id){
  const o = OFFERS.find(x=>x.id===id);
  let use = o.limit==="once" ? "This uses your one-time deal." : o.limit==="monthly" ? "This uses this month’s deal." : "You can use this deal every visit.";
  const m = state.member && state.member.status==="active" ? state.member : null;
  if(m && o.limit!=="unlimited") use = use.replace("your","your household’s").replace("this month’s deal","this month’s deal for your household");
  openSheet(`<h2 style="margin-top:0">Ready at the register?</h2>
    <p>Tap Redeem while the cashier at <strong>${o.biz}</strong> is watching. ${use}</p>
    ${m ? `<label class="f">Who’s at the register?</label><div class="chips" role="radiogroup" aria-label="Who is redeeming">
      <button class="chip" data-action="who" data-who="${esc(state.name)}" aria-pressed="${ui.who!==m.name}">${esc(state.name.split(" ")[0])}</button>
      <button class="chip" data-action="who" data-who="${esc(m.name)}" aria-pressed="${ui.who===m.name}">${esc(m.name.split(" ")[0])}</button></div>` : ""}
    <div class="row2"><button class="btn ghost" data-action="close">Not yet</button><button class="btn" data-action="redeem-confirm" data-id="${o.id}">Redeem</button></div>`);
}

/* ---------- Redemption screen ---------- */
function showRedeemed(id, sample){
  const o = OFFERS.find(x=>x.id===id);
  const last = state.redemptions[state.redemptions.length-1];
  const who = last && last.by ? last.by : state.name;
  const passLine = sample ? "Pass No. 214, Jordan Ellis" : `Pass No. ${state.passNo}, ${esc(who)}${who!==state.name?` <span style="opacity:.8">(household)</span>`:""}`;
  closeSheet();
  const el = document.createElement("div");
  el.className = "redeem"; el.setAttribute("role","dialog"); el.setAttribute("aria-modal","true"); el.setAttribute("aria-label","Deal redeemed");
  el.innerHTML = `<div class="check"><svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="#7A1E2C" stroke-width="3" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></div>
    <div class="r-biz">${o.biz}</div>
    <div class="r-deal">${o.deal}</div>
    <div class="clock" id="clock" aria-live="off"></div>
    <div class="r-date" id="rdate"></div>
    <div class="r-pass">${passLine}</div>
    <button class="btn" data-action="done">Done</button>
    <div class="hint">On a real redemption the clock ticks and the stripes move. A screenshot can’t.</div>`;
  document.getElementById("layer").appendChild(el);
  const tick = ()=>{ const n=new Date();
    document.getElementById("clock").textContent = n.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit",second:"2-digit"});
    document.getElementById("rdate").textContent = n.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"}); };
  tick(); clockTimer = setInterval(tick,1000);
  el.querySelector(".btn").focus();
}

/* ---------- Routing & events ---------- */
function route(){
  const h = location.hash.slice(1);
  ui.view = ["offers","pass","coach","biz","admin"].includes(h) ? h : (state.purchased ? "offers" : "pass");
  render();
}
function render(){
  const app = document.getElementById("app");
  const body = ui.view==="offers" ? viewOffers() : ui.view==="coach" ? viewCoach() : ui.view==="biz" ? viewBiz() : ui.view==="admin" ? viewAdmin() : (state.purchased ? viewPass() : viewBuy());
  app.innerHTML = roleBar() + body;
  document.querySelector(".tabs").hidden = ["coach","biz","admin"].includes(ui.view);
  const bp = document.getElementById("bizpick");
  if(bp) bp.addEventListener("change", e=>{ ui.biz=e.target.value; render(); });
  document.getElementById("tab-offers").setAttribute("aria-current", ui.view==="offers"?"page":"false");
  document.getElementById("tab-pass").setAttribute("aria-current", ui.view==="pass"?"page":"false");
  document.getElementById("tab-pass").lastChild.textContent = state.purchased ? "My pass" : "Get a pass";
  const team = document.getElementById("team");
  if(team) team.addEventListener("change", e=>ui.team=e.target.value);
  const q = document.getElementById("q");
  if(q) q.addEventListener("input", e=>{ ui.q=e.target.value; document.getElementById("list").innerHTML = offerRows(); });
}

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-action]"); if(!t) return;
  const a = t.dataset.action;
  if(a==="scrim"){ if(e.target===t) closeSheet(); return; }
  if(a==="close"){ closeSheet(); return; }
  if(a==="tour"){ wStep=0; renderWelcome(); return; }
  if(a==="w-next"){ if(wStep<SLIDES.length-1){ wStep++; renderWelcome(); } else closeSheet(); return; }
  if(a==="w-back"){ if(wStep>0){ wStep--; renderWelcome(); } else closeSheet(); return; }
  if(a==="checkout"){ sheetCheckout(); }
  if(a==="pay"){
    const name = document.getElementById("nm").value.trim(), email = document.getElementById("em").value.trim();
    if(!name || !email.includes("@")){ alert("Enter your name and a valid email to continue."); return; }
    t.disabled = true; t.textContent = "Processing…";
    setTimeout(()=>{
      Object.assign(state,{purchased:true,name,email,team:ui.team,passNo:String(100+Math.floor(Math.random()*900)),redemptions:[]});
      save(); render(); sheetSuccess();
    },900);
  }
  if(a==="cat"){ ui.cat = t.dataset.cat; render(); }
  if(a==="offer"){ sheetOffer(t.dataset.id); }
  if(a==="redeem-start"){ sheetConfirm(t.dataset.id); }
  if(a==="redeem-confirm"){
    const m = state.member && state.member.status==="active"; const by = m && ui.who===state.member.name ? state.member.name : state.name;
    state.redemptions.push({offerId:t.dataset.id, ts:Date.now(), by}); save();
    showRedeemed(t.dataset.id);
  }
  if(a==="biz-edit"){ sheetBizEdit(); return; }
  if(a==="biz-save"){
    const o = OFFERS.find(x=>x.id===ui.biz);
    const deal = clean(document.getElementById("ed-deal").value), limit = document.getElementById("ed-limit").value;
    const fine = clean(document.getElementById("ed-fine").value), addr = clean(document.getElementById("ed-addr").value);
    if(!deal){ document.getElementById("ed-deal").focus(); return; }
    const e = state.edits[o.id] = Object.assign({}, state.edits[o.id], {fine, addr});
    const base = {deal:o.deal, limit:o.limit};
    state.pending = state.pending.filter(p=>!(p.type==="change" && p.offerId===o.id));
    let msg = "Saved. Your changes are live.";
    if(deal===base.deal && limit!==base.limit && GENEROSITY[limit]>GENEROSITY[base.limit]){ e.limit = limit; msg = "Saved. Your deal is now available more often."; }
    else if(deal!==base.deal || limit!==base.limit){ state.pending.push({pid:"p"+Date.now(), type:"change", offerId:o.id, ts:Date.now(), proposed:{deal,limit}}); msg = "Sent for approval. Your current deal stays up until it’s approved."; }
    save(); render(); toast(msg); return;
  }
  if(a==="biz-cancel"){ state.pending = state.pending.filter(p=>p.pid!==t.dataset.pid); save(); render(); return; }
  if(a==="biz-pause"){ sheetBizPause(); return; }
  if(a==="biz-pause-save"){
    const v = document.getElementById("pz").value; if(!v) return;
    state.edits[ui.biz] = Object.assign({}, state.edits[ui.biz], {paused:v}); save(); render(); toast(`Paused until ${fmtDay(new Date(v+"T12:00"))}.`); return;
  }
  if(a==="biz-resume"){ state.edits[ui.biz] = Object.assign({}, state.edits[ui.biz], {paused:null}); save(); render(); return; }
  if(a==="biz-join"){ sheetBizJoin(); return; }
  if(a==="biz-join-send"){
    const g = id=>clean(document.getElementById(id).value);
    const n = {biz:g("nj-biz"),cat:document.getElementById("nj-cat").value,addr:g("nj-addr"),contact:g("nj-contact"),deal:g("nj-deal"),limit:document.getElementById("nj-limit").value,fine:g("nj-fine")};
    if(!n.biz || !n.deal || !n.contact){ document.getElementById(!n.biz?"nj-biz":!n.deal?"nj-deal":"nj-contact").focus(); return; }
    state.pending.push({pid:"p"+Date.now(), type:"new", ts:Date.now(), proposed:n}); save(); render();
    toast("Thanks! The program will review your deal. You’ll get a sign-in link once it’s approved."); return;
  }
  if(a==="adm-approve" || a==="adm-decline"){
    const p = state.pending.find(x=>x.pid===t.dataset.pid); if(!p) return;
    state.pending = state.pending.filter(x=>x!==p);
    if(a==="adm-approve"){
      if(p.type==="change") state.edits[p.offerId] = Object.assign({}, state.edits[p.offerId], {deal:p.proposed.deal, limit:p.proposed.limit});
      else { const n = p.proposed; state.added.push({id:"n"+Date.now(), biz:n.biz, deal:n.deal, cat:n.cat, limit:n.limit, value:5, color:NEW_COLORS[state.added.length%NEW_COLORS.length], fine:n.fine||"See store for details.", addr:n.addr}); }
    }
    save(); render(); return;
  }
  if(a==="adm-open"){ ui.biz = t.dataset.id; return; }
  if(a==="hh-add"){ sheetHousehold(); return; }
  if(a==="hh-send"){
    const n = document.getElementById("hn").value.trim(), c = document.getElementById("hc").value.trim();
    if(!n || c.replace(/\D/g,"").length<10){ alert("Enter their name and a 10-digit mobile number."); return; }
    if(!document.getElementById("hok").checked){ alert("Please confirm this person is your spouse or partner and lives at your address."); return; }
    if(n.toLowerCase()===state.name.toLowerCase()){ alert("Add someone other than yourself."); return; }
    state.member = {name:n, contact:c, status:"invited", ts:Date.now()}; save(); closeSheet(); render(); return;
  }
  if(a==="hh-accept"){ state.member.status="active"; state.member.ts=Date.now(); save(); render(); return; }
  if(a==="hh-remove"){
    const wasActive = state.member && state.member.status==="active";
    if(wasActive && !confirm(`Remove ${state.member.name}? You can only change your household member once per season.`)) return;
    if(wasActive) state.changesUsed++;
    state.member = null; ui.who = null; save(); render(); return;
  }
  if(a==="who"){ ui.who = t.dataset.who; document.querySelectorAll('[data-action="who"]').forEach(b=>b.setAttribute("aria-pressed", b===t)); return; }
  if(a==="biz-preview"){ showRedeemed(t.dataset.id, true); return; }
  if(a==="copy"){
    const link = t.dataset.link;
    const ok = ()=>{ t.textContent = "Link copied"; setTimeout(()=>{ t.textContent = "Copy share link"; },1800); };
    try{ navigator.clipboard.writeText(link).then(ok, ()=>{ t.textContent = link; }); }catch(err){ t.textContent = link; }
    return;
  }
  if(a==="done"){ clearInterval(clockTimer); document.getElementById("layer").innerHTML=""; render(); }
  if(a==="reset"){ state = load.blank(); state.seenWelcome=true; save(); location.hash="pass"; render(); window.scrollTo(0,0); wStep=0; renderWelcome(); }
});
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && document.querySelector(".scrim")) closeSheet(); });
window.addEventListener("hashchange", ()=>{ route(); window.scrollTo(0,0); });
route();
if(!state.seenWelcome){ state.seenWelcome=true; save(); wStep=0; renderWelcome(); }
</script>
</body>
</html>
